name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew tools/fetch-native.sh
          set -o pipefail
          tools/fetch-native.sh 2>&1 | tee build.log
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Mixokeys-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to the "latest" release (for downloading on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mixokeys.apk
          notes="Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title "Latest build" --notes "$notes" --prerelease
          fi
          gh release upload latest Mixokeys.apk --clobber

      - name: Report build errors as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Build failed for commit ${GITHUB_SHA::7}."
            echo
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILURE|Could not|Unresolved|> " build.log | head -120 || true
            echo '```'
            echo
            echo '<details><summary>Last 80 lines</summary>'
            echo
            echo '```'
            tail -80 build.log || true
            echo '```'
            echo '</details>'
          } > report.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file report.md
